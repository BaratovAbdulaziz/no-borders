[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "no-borders-kvm"
dynamic = ["version"]
description = "Cross-platform keyboard and mouse sharing tool"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "No-Borders", email = "contact@no-borders.dev"}
]
maintainers = [
    {name = "No-Borders", email = "contact@no-borders.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["kvm", "switch", "mouse", "keyboard", "sharing", "remote", "control", "no-borders"]
requires-python = ">=3.7"
dependencies = [
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
test = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/no-borders/kvm-switch"
Repository = "https://github.com/no-borders/kvm-switch"
Documentation = "https://github.com/no-borders/kvm-switch/wiki"
"Bug Tracker" = "https://github.com/no-borders/kvm-switch/issues"
Changelog = "https://github.com/no-borders/kvm-switch/blob/main/CHANGELOG.md"

[project.scripts]
kvm-switch = "kvm_switch.__main__:run"
no-borders-kvm = "kvm_switch.__main__:run"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.cfg", "*.ini"]

[tool.setuptools_scm]
write_to = "src/kvm_switch/_version.py"

[tool.black]
line-length = 88
target-version = ["py37", "py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"